# Publishes the app to GitHub Pages on every push to main.
# The app files are copied to the gh-pages branch, which Pages serves at
# https://<owner>.github.io/<repo>/. Installed copies pick up updates automatically.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update gh-pages branch
        run: |
          mkdir _site
          cp -r index.html config.js i18n.js sw.js manifest.webmanifest icons vendor _site/
          touch _site/.nojekyll
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Publish ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
